<script>
// ============================================================
// SCRIPTS.HTML — Client-side routing and page rendering
// ============================================================

let currentPage = 'home';

// ── Navigation ───────────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  renderPage(page);
  updateActiveNav(page);
  window.scrollTo(0, 0);
}

function updateActiveNav(page) {
  // Clear all active states
  document.querySelectorAll('.nav-item, .nav-child').forEach(el => el.classList.remove('active'));

  // Set active on matching nav item or child
  const all = document.querySelectorAll('[data-page]');
  all.forEach(el => {
    if (el.getAttribute('data-page') === page) el.classList.add('active');
  });

  // Auto-open parent group if a child is active
  const childGroups = { 'bsi': 'bsi-group', 'bsi-overview': 'bsi-group', 'bsi-technical': 'bsi-group', 'bsi-onepager': 'bsi-group',
                        'psi': 'psi-group', 'psi-overview': 'psi-group', 'psi-technical': 'psi-group', 'psi-onepager': 'psi-group' };
  const carets      = { 'bsi-group': 'bsi-caret', 'psi-group': 'psi-caret' };

  const groupId = childGroups[page];
  if (groupId) {
    const group = document.getElementById(groupId);
    const caret = document.getElementById(carets[groupId]);
    if (group)  group.classList.add('open');
    if (caret)  caret.classList.add('open');
  }
}

function toggleGroup(groupId) {
  const group = document.getElementById(groupId);
  const caretMap = { 'bsi-group': 'bsi-caret', 'psi-group': 'psi-caret' };
  const caret = document.getElementById(caretMap[groupId]);
  if (!group) return;
  group.classList.toggle('open');
  if (caret) caret.classList.toggle('open');
}

// ── Page Router ───────────────────────────────────────────────
function renderPage(page) {
  const container = document.getElementById('page-container');
  switch (page) {
    case 'home':         container.innerHTML = pagHome();         break;
    case 'feedback':     container.innerHTML = pagFeedback();     break;
    case 'bsi':          container.innerHTML = pagBSI();          break;
    case 'bsi-overview': container.innerHTML = pagBSIOverview();  break;
    case 'bsi-technical':container.innerHTML = pagBSITechnical(); break;
    case 'bsi-onepager': container.innerHTML = pagBSIOnePager();  break;
    case 'psi':          container.innerHTML = pagPSI();          break;
    case 'psi-overview': container.innerHTML = pagPSIOverview();  break;
    case 'psi-technical':container.innerHTML = pagPSITechnical(); break;
    case 'psi-onepager': container.innerHTML = pagPSIOnePager();  break;
    default:             container.innerHTML = pagHome();
  }
}

// ── Breadcrumb helper ─────────────────────────────────────────
function bc(parts) {
  return `<div class="breadcrumb">${parts.map((p, i) =>
    i < parts.length - 1
      ? `<span onclick="navigate('${p.page}')">${p.label}</span><span class="sep">›</span>`
      : `<span style="color:var(--text-dark);font-weight:600;">${p.label}</span>`
  ).join('')}</div>`;
}

// PAGE: BSI TECHNICAL GUIDE
// ============================================================
function pagBSITechnical() {
  return `
    ${bc([{label:'Home',page:'home'},{label:'BSI',page:'bsi'},{label:'Technical Guide'}])}
    <div class="page-header">
      <h1>BSI <span>Technical Guide</span></h1>
      <p>Full step-by-step walkthrough of the BSI workflow from setup through audit.</p>
    </div>

    <div class="callout callout-warn">
      <strong>Before you begin:</strong> BSI sends exactly what is in the sheet. Source data must be cleaned and formatted before running Prep. Errors in source data result in API rejections or bad records in AppFolio.
    </div>

    <div class="card">
      <div class="section-title">Step-by-Step Workflow</div>
      <ul class="step-list">

        <li class="step-item">
          <div class="step-num">1</div>
          <div class="step-content">
            <h4>Setup - Connect and Configure</h4>
            <p>Open the AppFolio Load Tool sidebar via the <em>Onboarding API</em> menu. Navigate to the Setup tab and enter your API credentials (Developer ID, Client ID, Client Secret). Select your target environment - IMPORT for testing, LIVE for production. The sidebar header will confirm the connected company name once credentials are saved.</p>
            <ul>
              <li>Always confirm the environment label before running any load</li>
              <li>GL Accounts must be synced from AppFolio before loading Recurring Charges</li>
              <li>Use the Setup checklist to confirm all pre-load steps are complete</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">2</div>
          <div class="step-content">
            <h4>Prepare Data in Sheet Tabs</h4>
            <p>Each object type has its own sheet tab (Banks, Owners, Properties, etc.). Populate rows with source data. Column headers must match the expected field names exactly. Reference IDs are auto-generated during Prep for most objects.</p>
            <ul>
              <li>SFR units are auto-created by AppFolio - the tool PATCHes marketing info only</li>
              <li>Recurring Charges are inline columns on the Tenants sheet, not a separate tab</li>
              <li>Owner and Occupancy late fees use dedicated status columns on their respective sheets</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">3</div>
          <div class="step-content">
            <h4>Prep - Validate Before Sending</h4>
            <p>Click Prep for each object type in the Load tab. Prep validates every non-Success row against required fields, formats, and cross-object dependencies. Rows are stamped Ready or Error - no data is sent to AppFolio during this step.</p>
            <ul>
              <li>Bank IDs, Owner IDs, Unit IDs etc. are resolved and stored as cell Notes during Prep</li>
              <li>All errors on a row are shown together so you can fix everything in one pass</li>
              <li>Re-Prep after fixing errors - Success rows are always skipped</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">4</div>
          <div class="step-content">
            <h4>Load Order - Dependencies Must Be Respected</h4>
            <p>Objects must be loaded in sequence because each step depends on IDs from the prior step. The sidebar enforces this with dependency gates - Load buttons are disabled until dependencies are met.</p>
            <ul>
              <li>Banks first - Properties require bank account IDs</li>
              <li>Owners + Properties (both loaded and synced) before Owner Assignments</li>
              <li>Properties before Unit Types, Unit Types before Units</li>
              <li>Units before Tenants - Tenants must be synced before Recurring Charges and Occupancy Late Fees</li>
              <li>GL Accounts synced before Recurring Charges</li>
              <li>Properties loaded before Property Late Fees</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">5</div>
          <div class="step-content">
            <h4>Load - Send to AppFolio</h4>
            <p>Click Load for each object type. Only Ready rows are sent, in batches of 40 records per API call. Results are written back to the sheet after each batch - a failure in one batch does not affect others. Success rows will never be re-sent.</p>
            <ul>
              <li>Rows are stamped Success (green), Error (red), or Pending (amber) immediately after each batch</li>
              <li>Large loads can be safely interrupted - completed batches are already written</li>
              <li>Error rows stay editable - fix the source data and re-Prep to retry</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">6</div>
          <div class="step-content">
            <h4>Sync - Resolve Async Jobs</h4>
            <p>Several object types (Owners, Unit Types, Tenants, Vendors, Late Fees) are processed asynchronously by AppFolio - the API returns a JobId immediately and resolves the record in the background. Run Sync after loading these objects to poll the Jobs endpoint and write the AppFolio IDs back to the sheet.</p>
            <ul>
              <li>Tenants require a two-phase sync: JobId resolves to TenantId, then a second call resolves OccupancyId</li>
              <li>OccupancyId is required before Recurring Charges or Occupancy Late Fees can be loaded</li>
              <li>Sync can be run from the Load tab button or the Audit tab for any log entry</li>
            </ul>
          </div>
        </li>

        <li class="step-item">
          <div class="step-num">7</div>
          <div class="step-content">
            <h4>Audit - Review Every Run</h4>
            <p>The Audit tab logs every Prep, Load, and Sync action. Each entry shows the object type, environment (IMPORT or LIVE), user, timestamp, and per-record outcomes - success count, pending jobs, and failure details with field-level error messages.</p>
            <ul>
              <li>Pending jobs can be synced directly from the Audit tab</li>
              <li>Entries are labeled IMPORT or LIVE so you can distinguish test runs from production runs</li>
              <li>Up to 100 most recent entries are shown in the dropdown</li>
            </ul>
          </div>
        </li>

      </ul>
    </div>

    <div class="section-title">Recovery Utilities</div>
    <div class="card">
      <p style="margin-bottom:10px;">Available under <em>Onboarding API</em> menu for edge cases:</p>
      <ul class="step-list" style="padding:0;">
        <li class="step-item">
          <div class="step-num" style="background:#f4cccc;color:#742a2a;">!</div>
          <div class="step-content">
            <h4>Reset Checklist</h4>
            <p>Clears all saved step progress. Use when starting a new onboarding project on the same spreadsheet.</p>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num" style="background:#fff2cc;color:#744210;">!</div>
          <div class="step-content">
            <h4>Release Occupancy Lock</h4>
            <p>Clears a stuck mutex if a Tenants load or sync was interrupted mid-run and the sidebar shows steps as locked.</p>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num" style="background:#fff2cc;color:#744210;">!</div>
          <div class="step-content">
            <h4>Clear Dependencies</h4>
            <p>Bypasses dependency gates without altering step states. Useful when re-running against a pre-populated environment where prior steps don't need to be re-run.</p>
          </div>
        </li>
      </ul>
    </div>
  `;
}
