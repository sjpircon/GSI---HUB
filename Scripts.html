<script>
// ============================================================
// SCRIPTS.HTML - Client-side routing and page rendering
// ============================================================

let currentPage = 'home';

// ── Navigation ───────────────────────────────────────────────
function navigate(page) {
  currentPage = page;
  renderPage(page);
  updateActiveNav(page);
  window.scrollTo(0, 0);
}

function updateActiveNav(page) {
  document.querySelectorAll('.nav-item, .nav-child').forEach(el => el.classList.remove('active'));
  const all = document.querySelectorAll('[data-page]');
  all.forEach(el => {
    if (el.getAttribute('data-page') === page) el.classList.add('active');
  });
  const childGroups = {
    'bsi': 'bsi-group', 'bsi-setup': 'bsi-group', 'bsi-overview': 'bsi-group',
    'bsi-technical': 'bsi-group', 'bsi-onepager': 'bsi-group', 'bsi-feedback': 'bsi-group',
    'psi': 'psi-group', 'psi-setup': 'psi-group', 'psi-overview': 'psi-group',
    'psi-technical': 'psi-group', 'psi-onepager': 'psi-group', 'psi-feedback': 'psi-group'
  };
  const carets = { 'bsi-group': 'bsi-caret', 'psi-group': 'psi-caret' };
  const groupId = childGroups[page];
  if (groupId) {
    const group = document.getElementById(groupId);
    const caret = document.getElementById(carets[groupId]);
    if (group) group.classList.add('open');
    if (caret) caret.classList.add('open');
  }
}

function toggleGroup(groupId) {
  const group = document.getElementById(groupId);
  const caretMap = { 'bsi-group': 'bsi-caret', 'psi-group': 'psi-caret' };
  const caret = document.getElementById(caretMap[groupId]);
  if (!group) return;
  group.classList.toggle('open');
  if (caret) caret.classList.toggle('open');
}

// ── Page Router ───────────────────────────────────────────────
function renderPage(page) {
  const container = document.getElementById('page-container');
  switch (page) {
    case 'home':          container.innerHTML = pagHome();         break;
    case 'api-setup':     container.innerHTML = pagAPISetup();     break;
    case 'feedback':      container.innerHTML = pagFeedback();     break;
    case 'bsi-feedback':  container.innerHTML = pagBSIFeedback();  break;
    case 'psi-feedback':  container.innerHTML = pagPSIFeedback();  break;
    case 'bsi':           container.innerHTML = pagBSI();          break;
    case 'bsi-setup':     container.innerHTML = pagBSISetup();     break;
    case 'bsi-overview':  container.innerHTML = pagBSIOverview();  break;
    case 'bsi-onepager':  container.innerHTML = pagBSIOverview();  break;
    case 'bsi-technical': container.innerHTML = pagBSITechnical(); break;
    case 'psi':           container.innerHTML = pagPSI();          break;
    case 'psi-overview':  container.innerHTML = pagPSIOverview();  break;
    case 'psi-onepager':  container.innerHTML = pagPSIOverview();  break;
    case 'psi-technical': container.innerHTML = pagPSITechnical(); break;
    default:              container.innerHTML = pagHome();
  }
}


function bc(parts) {
  return `<div class="breadcrumb">${parts.map((p, i) =>
    i < parts.length - 1
      ? `<span onclick="navigate('${p.page}')">${p.label}</span><span class="sep">›</span>`
      : `<span style="color:var(--text-dark);font-weight:600;">${p.label}</span>`
  ).join('')}</div>`;
}

// Escalation state — one set shared, reset on each page navigate
let _escTool = null, _escActiveCat = null, _escOpenStep = null, _escSubmitted = false, _escSubmitting = false;

function _escReset(tool) {
  _escTool = tool; _escActiveCat = null; _escOpenStep = null;
  _escSubmitted = false; _escSubmitting = false;
}

function _escCatList() {
  const cats = ESC_CATEGORIES[_escTool] || [];
  return cats.map(c => `
    <button onclick="_escSelectCat('${c.id}')"
      style="width:100%;background:#fff;border:1.5px solid #e2e8f0;border-left:5px solid ${c.color};
             border-radius:10px;padding:16px 20px;text-align:left;cursor:pointer;margin-bottom:10px;
             font-family:inherit;transition:box-shadow 0.15s;"
      onmouseover="this.style.boxShadow='0 3px 12px rgba(0,0,0,0.07)'"
      onmouseout="this.style.boxShadow='none'">
      <div style="font-size:14px;font-weight:700;color:#1a1f2e;margin-bottom:3px;">${c.emoji} ${c.label}</div>
      <div style="font-size:12px;color:#718096;">${c.sub}</div>
    </button>`).join('');
}

function _escSelectCat(id) {
  _escActiveCat = (ESC_CATEGORIES[_escTool] || []).find(c => c.id === id);
  _escOpenStep = 0; _escSubmitted = false;
  document.getElementById('esc-cat-view').style.display  = 'none';
  document.getElementById('esc-flow-view').style.display = 'block';
  _escRenderFlow();
}

function _escBack() {
  _escActiveCat = null; _escOpenStep = null; _escSubmitted = false;
  document.getElementById('esc-cat-view').style.display  = 'block';
  document.getElementById('esc-flow-view').style.display = 'none';
}

function _escToggleStep(i) {
  _escOpenStep = _escOpenStep === i ? null : i;
  _escRenderFlow();
}

function _escRenderFlow() {
  const c  = _escActiveCat;
  const el = document.getElementById('esc-flow-card');
  if (!el || !c) return;
  el.style.borderColor = c.border;
  el.innerHTML = `
    <div style="background:${c.bg};padding:16px 20px;border-bottom:1px solid ${c.border};">
      <div style="font-size:16px;font-weight:700;color:${c.color};margin-bottom:2px;">${c.emoji} ${c.label}</div>
      <div style="font-size:12px;color:#718096;">${c.sub}</div>
    </div>
    ${c.steps.map((s, i) => _escRenderStep(s, i, c)).join('')}`;
}

function _escRenderStep(step, i, c) {
  const isOpen = _escOpenStep === i;
  const isLast = i === _escActiveCat.steps.length - 1;
  let body = '';
  if (isOpen) {
    if (step.type === 'info') {
      body = `<div style="padding:4px 20px 16px 58px;"><p style="font-size:13px;color:#2d3748;line-height:1.65;margin:0;">${step.body}</p></div>`;
    } else if (step.type === 'checklist') {
      body = `<div style="padding:4px 20px 16px 58px;"><ul style="list-style:none;padding:0;margin:0;">
        ${step.items.map(item => `<li style="display:flex;gap:8px;font-size:13px;color:#2d3748;margin-bottom:6px;line-height:1.5;">
          <span style="color:${c.color};font-weight:700;flex-shrink:0;">✓</span><span>${item}</span></li>`).join('')}
      </ul></div>`;
    } else if (step.type === 'action') {
      const isFb = c.issueType.includes('Feedback') || c.issueType.includes('Gap');
      body = `<div style="padding:4px 20px 16px 58px;">
        <p style="font-size:13px;color:#2d3748;line-height:1.65;margin:0 0 14px;">${step.body}</p>
        ${_escSubmitted
          ? `<div style="background:#f0fff4;border:1.5px solid #68d391;border-radius:8px;padding:12px 16px;font-size:13px;color:#276749;font-weight:600;">
               ✅ Submitted! A lead will review your ${isFb ? 'feedback' : 'report'} shortly.
             </div>`
          : _escRenderForm(c)}
      </div>`;
    }
  }
  return `
    <div style="${isLast ? '' : 'border-bottom:1px solid #f0f4f8;'}">
      <div onclick="_escToggleStep(${i})"
        style="display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;
               background:${isOpen ? '#fafbfc' : '#fff'};">
        <div style="width:26px;height:26px;border-radius:50%;flex-shrink:0;font-size:12px;font-weight:700;
                    display:flex;align-items:center;justify-content:center;
                    background:${isOpen ? c.color : '#edf2f7'};color:${isOpen ? '#fff' : '#718096'};">${i + 1}</div>
        <div style="flex:1;font-size:13px;font-weight:600;color:#1a1f2e;">${step.title}</div>
        <span style="font-size:11px;color:#a0aec0;">${isOpen ? '▲' : '▼'}</span>
      </div>
      ${body}
    </div>`;
}

function _escRenderForm(c) {
  const objTypes = _escTool === 'BSI' ? ESC_OBJECT_TYPES_BSI : ESC_OBJECT_TYPES_PSI;
  const isFb     = c.issueType.includes('Feedback') || c.issueType.includes('Gap');
  return `
    <div style="display:flex;flex-direction:column;gap:0;">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;color:#a0aec0;margin-bottom:10px;">Client Details</div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Customer Name *</label>
        <input id="esc-customer" type="text" placeholder="e.g. Acme Property Management" style="${_escInputStyle()}"/></div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">PMREO Link *</label>
        <input id="esc-pmreo" type="text" placeholder="https://..." style="${_escInputStyle()}"/></div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Spreadsheet Link *</label>
        <input id="esc-sheet" type="text" placeholder="https://docs.google.com/..." style="${_escInputStyle()}"/></div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Database Link *</label>
        <input id="esc-db" type="text" placeholder="https://..." style="${_escInputStyle()}"/></div>
      <hr style="border:none;border-top:1.5px dashed #e2e8f0;margin:14px 0;"/>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.9px;color:#a0aec0;margin-bottom:10px;">Issue Details</div>
      <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <label style="font-size:12px;font-weight:600;color:#2d3748;">Issue Type</label>
        <span style="background:${c.bg};color:${c.color};border:1px solid ${c.border};border-radius:5px;padding:3px 10px;font-size:12px;font-weight:700;">${c.emoji} ${c.issueType}</span>
      </div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Object Type *</label>
        <select id="esc-object" style="${_escInputStyle()}">
          <option value="">Select object type...</option>
          ${objTypes.map(o => `<option value="${o}">${o}</option>`).join('')}
        </select></div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Description *</label>
        <textarea id="esc-desc" rows="4" placeholder="Describe the issue, what you expected, and any error text."
          style="${_escInputStyle()}resize:vertical;line-height:1.5;min-height:90px;"></textarea></div>
      <div style="margin-bottom:12px;"><label style="display:block;font-size:12px;font-weight:600;color:#2d3748;margin-bottom:4px;">Screenshots (optional)</label>
        <input id="esc-shots" type="text" placeholder="Paste a Drive link to any screenshots" style="${_escInputStyle()}"/></div>
      <div id="esc-error" style="display:none;font-size:12px;color:#e53e3e;font-weight:600;margin-bottom:8px;"></div>
      <button id="esc-submit" onclick="_escSubmit()"
        style="background:${c.color};color:#fff;border:none;border-radius:7px;padding:9px 20px;
               font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;align-self:flex-start;">
        Submit ${isFb ? 'Feedback' : 'Report'} →
      </button>
    </div>`;
}

function _escInputStyle() {
  return 'width:100%;box-sizing:border-box;padding:8px 10px;font-size:13px;border:1.5px solid #e2e8f0;border-radius:6px;font-family:inherit;color:#1a1f2e;background:#fff;';
}

function _escSubmit() {
  if (_escSubmitting) return;
  const get = id => (document.getElementById(id)?.value || '').trim();
  const customer = get('esc-customer'), pmreo = get('esc-pmreo');
  const sheet    = get('esc-sheet'),    db    = get('esc-db');
  const obj      = get('esc-object'),   desc  = get('esc-desc');
  const shots    = get('esc-shots');
  const errEl    = document.getElementById('esc-error');
  if (!customer || !pmreo || !sheet || !db) {
    errEl.textContent = 'Please fill out all Client Details fields.'; errEl.style.display = 'block'; return;
  }
  if (!obj || !desc) {
    errEl.textContent = 'Please fill out Object Type and Description.'; errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.getElementById('esc-submit');
  btn.textContent = 'Submitting…'; btn.disabled = true; _escSubmitting = true;
  google.script.run
    .withSuccessHandler(() => {
      google.script.run
        .withSuccessHandler(() => { _escSubmitting = false; _escSubmitted = true; _escRenderFlow(); })
        .withFailureHandler(e => { _escSubmitting = false; btn.disabled = false; btn.textContent = 'Submit →'; errEl.textContent = 'Submission failed: ' + (e.message || 'Unknown error.'); errEl.style.display = 'block'; })
        .submitEscalation();
    })
    .withFailureHandler(e => { _escSubmitting = false; btn.disabled = false; btn.textContent = 'Submit →'; errEl.textContent = 'Submission failed: ' + (e.message || 'Unknown error.'); errEl.style.display = 'block'; })
    .saveEscalationDraft(_escTool, customer, pmreo, sheet, db, _escActiveCat.issueType, obj, desc, shots || 'N/A', new Date().toISOString());
}

  return `

    <div class="page-header">
      <h1>${tool} <span>Feedback & Escalation</span></h1>
      <p>Pick the situation that best describes your issue and follow the steps before submitting.</p>
    </div>

    <div id="esc-cat-view">
      <div style="margin-bottom:16px;">${_escCatList()}</div>
      <div class="card">
        <div class="section-title">How Escalation Works</div>
        <div style="display:flex;gap:12px;align-items:flex-start;font-size:13px;margin-bottom:10px;">
          <span style="font-size:16px;flex-shrink:0;">📋</span>
          <div><strong>Issue Report Form</strong> <span style="color:var(--text-muted);">- For bugs and errors - feeds directly into the ${tool} issue log.</span></div>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-start;font-size:13px;margin-bottom:10px;">
          <span style="font-size:16px;flex-shrink:0;">💡</span>
          <div><strong>Feedback Form</strong> <span style="color:var(--text-muted);">- For tool and doc feedback - reviewed weekly by the onboarding leads.</span></div>
        </div>
        <div style="display:flex;gap:12px;align-items:flex-start;font-size:13px;">
          <span style="font-size:16px;flex-shrink:0;">📊</span>
          <div><strong>${tool} Issue Log</strong> <span style="color:var(--text-muted);">- Leads use this to triage, track status, and escalate to product when needed.</span></div>
        </div>
      </div>
    </div>

    <div id="esc-flow-view" style="display:none;">
      <button onclick="_escBack()"
        style="background:none;border:none;color:var(--af-blue-dim);font-size:13px;font-weight:600;
               cursor:pointer;margin-bottom:14px;padding:0;font-family:inherit;">
        ← Back to all issues
      </button>
      <div id="esc-flow-card" class="card" style="padding:0;overflow:hidden;border:1.5px solid #e2e8f0;"></div>
    </div>`;
}

          </div>
        </li>

      </ul>
    </div>
  `;

// PAGE: BSI ONE-PAGER (merged overview + reference)
// ============================================================
function pagBSIOverview() {
  return `
    ${bc([{label:'Home',page:'home'},{label:'BSI',page:'bsi'},{label:'One-Pager'}])}
    <div class="page-header">
      <h1>BSI <span>One-Pager</span></h1>
      <p>What it is, how it fits into a project, and what it cannot do.</p>
    </div>

    <div class="callout callout-blue">
      <strong>Core value:</strong> Say goodbye to wipe-and-replace! BSI tracks every row individually: when errors occur, only those specific rows need to be corrected and resent - not the entire spreadsheet. Successful records are permanently skipped on future runs, so only new or broken rows get touched. Load across multiple sessions without ever disturbing what's already landed in AppFolio. With BSI, we now have the flexibility without the risk of overwriting good data.
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>What BSI Does</h2>
      <p>BSI is a Google Sheets sidebar that connects directly to the Onboarding API to create onboarding records in volume. It handles the full set of objects needed to stand up a new AppFolio environment - from bank accounts through to tenant occupancies and recurring charges. Each load is additive and non-destructive: records already in AppFolio are never re-sent, or wiped.</p>
    </div>

    <div class="section-title">Supported Objects</div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Primary objects</p>
    <div class="badge-grid">
      <span class="obj-badge">Banks</span>
      <span class="obj-badge">Owners</span>
      <span class="obj-badge">Properties</span>
      <span class="obj-badge">Unit Types</span>
      <span class="obj-badge">Units</span>
      <span class="obj-badge">Tenants</span>
      <span class="obj-badge">Vendors</span>
    </div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Sub-operations</p>
    <div class="badge-grid">
      <span class="obj-badge sub">GL Account Sync</span>
      <span class="obj-badge sub">Owner Assignments</span>
      <span class="obj-badge sub">Property Late Fees</span>
      <span class="obj-badge sub">Recurring Charges</span>
      <span class="obj-badge sub">Occupancy Late Fees</span>
      
    </div>

    <div class="section-title">Row Status System</div>
    <div class="card" style="margin-bottom:16px;">
      <p style="margin-bottom:10px;">Every row in every sheet tab carries a status that controls what happens on the next run:</p>
      <div>
        <span class="s-pill s-ready">Ready</span> Validated and queued for the next Load run<br/><br/>
        <span class="s-pill s-success">Success</span> Loaded successfully - permanently skipped on all future runs<br/><br/>
        <span class="s-pill s-error">Error</span> Failed validation or API rejection - fix the row and re-Prep<br/><br/>
        <span class="s-pill s-pending">Pending</span> Submitted to AppFolio asynchronously - run Sync to resolve
      </div>
    </div>

    <div class="section-title">Required Load Order</div>
    <div class="card" style="margin-bottom:16px;">
      <ul class="step-list" style="padding:0;">
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">1</div><div class="step-content"><h4>GL Account Import & Sync</h4><p style="font-size:12px;">Must be completed before anything else. Import the chart of accounts via the Spreadsheet Importer, then sync. GL UUIDs are stored as cell Notes and referenced throughout Prep - Properties with Additional Cash Accounts and Recurring Charges both depend on this.</p></div></li>
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">2</div><div class="step-content"><h4>Banks</h4><p style="font-size:12px;">Required before Properties. Each property must be linked to an Operating Cash and Escrow bank account using IDs generated from this load.</p></div></li>
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">3</div><div class="step-content"><h4>Owners + Properties (independent, but both needed before Owner Assignments)</h4><p style="font-size:12px;">Owners and Properties can be loaded in parallel - neither depends on the other. However, both must be fully loaded and synced before Owner Assignments can run, since assignments require an AppFolio Owner ID and a Property ID.</p></div></li>
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">4</div><div class="step-content"><h4>Properties → Unit Types → Units</h4><p style="font-size:12px;">Unit Types and Units are children of Properties - they cannot exist without a parent Property ID. Unit Types must also be loaded before Units, as Units reference the Unit Type for classification.</p></div></li>
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">5</div><div class="step-content"><h4>Units → Tenants (+ Sync) → Recurring Charges</h4><p style="font-size:12px;">Tenants are linked to a specific Unit at load time. After loading, Tenants must be synced to resolve the OccupancyId - this ID is required before Recurring Charges can be prepped or loaded.</p></div></li>
        <li class="step-item"><div class="step-num" style="width:20px;height:20px;font-size:10px;">6</div><div class="step-content"><h4>Late Fees (property or occupancy level)</h4><p style="font-size:12px;">Property Late Fees require a loaded Property ID. Occupancy Late Fees require a synced Tenant (OccupancyId). Both can be run independently once their parent is resolved.</p></div></li>
      </ul>
    </div>

    <div class="section-title">What BSI Cannot Do</div>
    <div class="card" style="margin-bottom:16px;">
      <ul style="padding-left:16px;font-size:13px;color:var(--text-body);line-height:2;">
        <li>Delete records already in AppFolio</li>
        <li>Load work orders, maintenance requests, or inspections</li>
        <li>Load lease documents or file attachments</li>
        <li>Load portal settings or owner/tenant preferences</li>
        <li>Transform or clean source data - data must arrive pre-formatted</li>
        <li>Replace the manual GL Account import in the AppFolio UI</li>
        <li>Operate outside of Google Sheets</li>
      </ul>
    </div>

    <div class="callout callout-warn">
      <strong>Data responsibility:</strong> BSI sends exactly what is in the sheet. Pre-clean and validate source data before running Prep - errors in source data result in API rejections or bad records in AppFolio.
    </div>
  `;
}

    </div>

    <div class="callout callout-warn">
      <strong>Before you begin:</strong> BSI sends exactly what is in the sheet. Source data must be cleaned and formatted before running Prep. Errors in source data result in API rejections or bad records in AppFolio.
    </div>

    <div class="callout callout-warn">
      <strong>Before you begin:</strong> Upload the Chart of Accounts via the Spreadsheet Import as usual.
    </div>

    <div class="card">
      <div class="section-title">Step-by-Step Workflow</div>
      <ul class="step-list">
        <li class="step-item">
          <div class="step-num">1</div>
          <div class="step-content">
            <h4>Setup - Connect and Configure</h4>
            <p>Open the AppFolio Load Tool sidebar via the <em>Onboarding API</em> menu. Navigate to the Setup tab and enter your API credentials (Developer ID, Client ID, Client Secret). Select your target environment - IMPORT for testing, LIVE for production. The sidebar header will confirm the connected company name once credentials are saved.</p>
            <ul>
              <li>Always confirm the environment label before running any load</li>
              <li>GL Accounts must be uploaded and synced from AppFolio before loading Properties or Recurring Charges</li>
              <li>Use the Setup checklist to confirm all pre-load steps are complete</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">2</div>
          <div class="step-content">
            <h4>Prepare Data in Sheet Tabs</h4>
            <p>Each object type has its own sheet tab (Banks, Owners, Properties, etc.). Populate rows with source data. Column headers must match the expected field names exactly. Reference IDs are auto-generated during Prep.</p>
            <ul>
              <li>Recurring Charges are inline columns on the Tenants sheet, not a separate tab</li>
              <li>Owners and Late Fees use dedicated status columns on their respective tabs</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">3</div>
          <div class="step-content">
            <h4>Prep - Validate Before Sending</h4>
            <p>Click Prep for each object type in the Load tab. Prep validates every non-Success row against required fields, formats, and cross-object dependencies. Rows are stamped Ready or Error - no data is sent to AppFolio during this step.</p>
            <ul>
              <li>Bank IDs, Owner IDs, Unit IDs etc. are resolved and stored as cell Notes during Prep</li>
              <li>All errors on a row are shown together so you can fix everything in one pass</li>
              <li>Re-Prep after fixing errors - Success rows are always skipped</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">4</div>
          <div class="step-content">
            <h4>Load Order - Dependencies Must Be Respected</h4>
            <p>Objects must be loaded in sequence because each step depends on IDs from the prior step. The sidebar enforces this with dependency gates - Load buttons are disabled until dependencies are met.</p>
            <ul>
              <li>GL Accounts synced first - Properties require the IDs</li>
              <li>Banks - Properties require bank account IDs</li>
              <li>Owners + Properties (both loaded and synced) before Owner Assignments</li>
              <li>Properties before Unit Types, Unit Types before Units</li>
              <li>Units before Tenants - Tenants must be synced before Recurring Charges and Occupancy Late Fees</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">5</div>
          <div class="step-content">
            <h4>Load - Send to AppFolio</h4>
            <p>Click Load for each object type. Only Ready rows are sent, in batches of 40 records per API call. Results are written back to the sheet after each batch - a failure in one batch does not affect others. Success rows will never be re-sent.</p>
            <ul>
              <li>Rows are stamped Success (green), Error (red), or Pending (yellow) immediately after each batch</li>
              <li>Large loads can be safely interrupted - completed batches are already written</li>
              <li>Error rows stay editable - fix the source data and re-Prep to retry</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">6</div>
          <div class="step-content">
            <h4>Sync - Resolve Async Jobs</h4>
            <p>Several object types (Owners, Unit Types, Tenants, Vendors, Late Fees) are processed asynchronously by AppFolio - the API returns a JobId immediately and resolves the record in the background. Run Sync after loading these objects to poll the Jobs endpoint and write the AppFolio IDs back to the sheet.</p>
            <ul>
              <li>Tenants require a two-phase sync: JobId resolves to TenantId, then a second call resolves OccupancyId</li>
              <li>OccupancyId is required before Recurring Charges or Occupancy Late Fees can be loaded</li>
              <li>Sync can be run from the Load tab button or the Audit tab for any log entry</li>
            </ul>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num">7</div>
          <div class="step-content">
            <h4>Audit - Review Every Run</h4>
            <p>The Audit tab logs every Prep, Load, and Sync action. Each entry shows the object type, environment (IMPORT or LIVE), user, timestamp, and per-record outcomes - success count, pending jobs, and failure details with field-level error messages.</p>
            <ul>
              <li>Pending jobs can be synced directly from the Audit tab</li>
              <li>Entries are labeled IMPORT or LIVE so you can distinguish test runs from production runs</li>
              <li>Up to 100 most recent entries are shown in the dropdown</li>
            </ul>
          </div>
        </li>
      </ul>
    </div>

    <div class="section-title">Recovery Utilities</div>
    <div class="card">
      <p style="margin-bottom:10px;">Available under <em>Onboarding API</em> menu for edge cases:</p>
      <ul class="step-list" style="padding:0;">
        <li class="step-item">
          <div class="step-num" style="background:#f4cccc;color:#742a2a;">!</div>
          <div class="step-content">
            <h4>Reset Checklist</h4>
            <p>Clears all saved step progress. Use when starting a new onboarding project on the same spreadsheet.</p>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num" style="background:#fff2cc;color:#744210;">!</div>
          <div class="step-content">
            <h4>Release Occupancy Lock</h4>
            <p>Clears a stuck Tenants load or sync was interrupted mid-run and the sidebar shows steps as locked.</p>
          </div>
        </li>
        <li class="step-item">
          <div class="step-num" style="background:#fff2cc;color:#744210;">!</div>
          <div class="step-content">
            <h4>Clear Dependencies</h4>
            <p>Bypasses dependency gates without altering step states. Useful when re-running against a pre-populated environment where prior steps don't need to be re-run.</p>
          </div>
        </li>
      </ul>
    </div>
  `;
}
